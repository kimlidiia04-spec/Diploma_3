name: Automated Tests & Allure Report

on:
  push:
    branches: [ "main", "develop-3", "develop3_UI" ]
  pull_request:
    branches: [ "main", "develop-3", "develop3_UI" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Allure commandline (optional for local generation, but needed if used)
        uses: simple-elf/allure-action@master
        with:
          allure_results: 'allure-results'

      - name: Run Pytest tests
        run: |
          pytest --alluredir=allure-results || true

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure Report
        uses: simple-elf/allure-action@master
        if: always()
        id: allure-report
        with:
          allure_results: 'allure-results'
          gh_pages: 'gh-pages'
          allure_report: 'allure-report'
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_new_commit: true